<!doctype html>
<html lang="en-NG">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}M.O.D. Nsukka Diocese{% endblock %}</title>
    {% load static %}
    <link rel="icon" href="{% static 'favicon.ico' %}" sizes="any">
    <link rel="stylesheet" href="{% static 'css/tokens/colors.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/typography.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/spacing.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/borders.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/shadows.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/transitions.css' %}">

    <link rel="stylesheet" href="{% static 'css/tokens/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/compatibility.css' %}">
    <link rel="stylesheet" href="{% static 'css/tokens/responsive.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/reset.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/document.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/links.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/forms.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/accessibility.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/media.css' %}">
    <link rel="stylesheet" href="{% static 'css/base/layout.css' %}">
    <link rel="stylesheet" href="{% static "css/components/hero.css" %}">
    <link rel="stylesheet" href="{% static 'css/pages/home-themes.css' %}">
    {% block page_css %}{% endblock %}
</head>
<body>
    <main class="site-main">
        {% block content %}{% endblock %}
    </main>
    <button class="home-theme-toggle home-theme-toggle-compact"
            id="home-theme-switch"
            type="button"
            aria-label="Switch to Command &amp; Discipline theme"
            aria-pressed="false"
            title="Switch theme">
        <span class="home-theme-toggle-indicator" aria-hidden="true">◐</span>
    </button>
    {% block page_js %}{% endblock %}
    <script src="{% static 'js/pages/home-theme.js' %}" defer></script>
</body>
</html>
