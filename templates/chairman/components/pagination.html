{% if page.has_other_pages %}
    <nav class="chairman-pagination" aria-label="Pagination">
        {% if page.has_previous %}
            <a href="{{ current_path }}?q={{ search_query|urlencode }}&amp;page={{ page.previous_page_number }}">Previous</a>
        {% endif %}
        <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
        {% if page.has_next %}
            <a href="{{ current_path }}?q={{ search_query|urlencode }}&amp;page={{ page.next_page_number }}">Next</a>
        {% endif %}
    </nav>
{% endif %}
